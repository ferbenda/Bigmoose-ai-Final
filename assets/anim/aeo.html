<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AEO — PNG animado</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@400;500&family=Archivo:wght@400;500&family=Raleway:wght@200;300&display=swap" rel="stylesheet">
<style>
:root{ --hot:#9ad4ff; --glow:#4d9bff; --radius:20px; }

body{margin:0;background:#02071a;display:grid;place-items:center;min-height:100vh;padding:28px;box-sizing:border-box;}

/* ============ el contenedor ============ */
.aeo-stage{
  position:relative;width:100%;max-width:1400px;aspect-ratio:1672/941;
  border-radius:var(--radius);overflow:hidden;isolation:isolate;background:#02071a;
  container-type:inline-size;
}

/* ============ query escribiéndose en el search bar ============ */
/* Geometría calcada del PNG:
   - divisor del icono de lupa .......... x = 724
   - interior útil del campo ............ x 730 → 1055  (325 px)
   - línea central del campo ............ y = 183.05 en x=730
   - inclinación del panel .............. -6.97°  (medida sobre los bordes) */
.aeo-stage .query-layer{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:5;}
.q-text{
  font-family:Archivo,"Helvetica Neue",Arial,sans-serif;
  font-weight:500;font-size:32px;fill:#f4faff;
}
/* revelado letra por letra: el clip se abre en 52 pasos */
.q-clip{transform-box:fill-box;transform-origin:left center;
        animation:qtype 13s steps(19,end) infinite;}
@keyframes qtype{
  0%,3%    {transform:scaleX(0)}
  30%,88%  {transform:scaleX(1)}
  97%,100% {transform:scaleX(0)}
}
/* el caret viaja con el mismo steps(), así que nunca se desincroniza */
.q-caret{fill:#9ad4ff;animation:qcaret 13s steps(19,end) infinite, qblink 1.05s steps(1) infinite;}
@keyframes qcaret{
  0%,3%    {transform:translateX(0)}
  30%,88%  {transform:translateX(304px)}
  97%,100% {transform:translateX(0)}
}
@keyframes qblink{50%{opacity:0}}

/* CAPA 1 — el PNG original, intacto. Ken Burns muy sutil. */
.aeo-stage .plate{
  position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  transform-origin:55% 59%;                 /* ancla en el core */
  animation:kenburns 24s ease-in-out infinite alternate;
  will-change:transform;
}
@keyframes kenburns{
  from{transform:scale(1)   translate3d(0,0,0);}
  to  {transform:scale(1.045) translate3d(-.6%,-.4%,0);}
}

/* CAPA 2 — respiración del core. Blend screen: solo suma luz, no tapa. */
.aeo-stage .core-pulse{
  position:absolute;left:55%;top:59%;width:26%;aspect-ratio:1;
  transform:translate(-50%,-50%);
  border-radius:50%;pointer-events:none;mix-blend-mode:screen;
  background:radial-gradient(circle, rgba(120,190,255,.55) 0%, rgba(60,130,255,.22) 38%, transparent 68%);
  animation:breathe 5.2s ease-in-out infinite;
}
@keyframes breathe{
  0%,100%{opacity:.35;transform:translate(-50%,-50%) scale(.9);}
  50%    {opacity:.95;transform:translate(-50%,-50%) scale(1.18);}
}

/* CAPA 3 — barrido de luz diagonal, 11s */
.aeo-stage .sweep{
  position:absolute;top:-25%;bottom:-25%;width:22%;pointer-events:none;
  mix-blend-mode:screen;filter:blur(10px);transform:skewX(-14deg);
  background:linear-gradient(100deg,transparent,rgba(150,205,255,.09) 45%,rgba(180,220,255,.2) 50%,rgba(150,205,255,.09) 55%,transparent);
  animation:sweep 11s cubic-bezier(.75,0,.25,1) infinite;
}
@keyframes sweep{0%,62%{left:-25%}100%{left:110%}}

/* CAPA 4 — pulsos de datos sobre la circuitería (SVG, coords del PNG) */
.aeo-stage .circuit{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;mix-blend-mode:screen;}
.pulse{stroke-dasharray:5 300;stroke-linecap:round;animation:run 4s linear infinite;}
@keyframes run{from{stroke-dashoffset:305}to{stroke-dashoffset:0}}
.p1{animation-delay:0s}.p2{animation-delay:.7s}.p3{animation-delay:1.4s}
.p4{animation-delay:2s}.p5{animation-delay:2.6s}.p6{animation-delay:3.2s}
.p7{animation-delay:1.1s}.p8{animation-delay:2.9s}

/* CAPA 5 — vignette que respira, para dar profundidad */
.aeo-stage .vig{
  position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(75% 65% at 55% 59%, transparent 40%, rgba(1,4,16,.55) 100%);
  animation:vig 8s ease-in-out infinite;
}
@keyframes vig{0%,100%{opacity:.75}50%{opacity:.45}}

.caption{
  position:absolute;left:3.2%;bottom:5.5%;z-index:6;margin:0;
  font-family:Raleway,system-ui,sans-serif;font-weight:300;
  font-size:clamp(9px,.86vw,13px);letter-spacing:.34em;text-transform:uppercase;
  color:rgba(200,222,255,.6);
}

@media (prefers-reduced-motion:reduce){
  .plate,.core-pulse,.sweep,.vig,.pulse,.q-clip,.q-caret{animation:none !important}
  .sweep{display:none}
  .core-pulse{opacity:.6}
  .q-clip{transform:scaleX(1)} .q-caret{transform:translateX(304px)}
}
</style>
</head>
