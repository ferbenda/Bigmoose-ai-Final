<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AIagents</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@200;300&display=swap" rel="stylesheet">
<style>
:root{ --hot:#a9dcff; --radius:20px; }
body{margin:0;background:#02071a;display:grid;place-items:center;min-height:100vh;padding:28px;box-sizing:border-box;}

/* ===================== AIagents ===================== */
.aiagents{
  position:relative;width:100%;max-width:1400px;aspect-ratio:1672/941;
  border-radius:var(--radius);overflow:hidden;isolation:isolate;background:#02071a;
}
/* todo lo que comparte perspectiva vive dentro de .stack, así el Ken Burns
   los mueve juntos y las capas nunca se desalinean entre sí */
.stack{position:absolute;inset:0;transform-origin:52.8% 53.1%;
       animation:kenburns 30s ease-in-out infinite alternate;will-change:transform;}
@keyframes kenburns{from{transform:scale(1)}to{transform:scale(1.045) translate3d(-.4%,-.25%,0)}}

.stack img{position:absolute;display:block;}
.plate{inset:0;width:100%;height:100%;object-fit:cover;}

/* ---- las 4 islas de agentes: salto con anticipación y aterrizaje ---- */
.agent{transform-origin:50% 100%;will-change:transform;}
@keyframes hop{
  0%,100%{transform:translateY(0)            scaleY(1)}
  9%     {transform:translateY(0)            scaleY(.972)}
  40%    {transform:translateY(var(--lift))  scaleY(1.022)}
  72%    {transform:translateY(0)            scaleY(.982)}
  86%    {transform:translateY(0)            scaleY(1.006)}
}
.a1{--lift:-3.5%; animation:hop 2.90s cubic-bezier(.36,.06,.28,1) infinite;}
.a2{--lift:-3.5%; animation:hop 2.60s cubic-bezier(.36,.06,.28,1) infinite .45s;}
.a3{--lift:-3.0%; animation:hop 3.15s cubic-bezier(.36,.06,.28,1) infinite .90s;}
.a4{--lift:-3.1%; animation:hop 2.75s cubic-bezier(.36,.06,.28,1) infinite 1.35s;}

/* ---- la torre central creciendo hacia arriba ---- */
.tower{transform-origin:50% 100%;will-change:transform;
       animation:grow 9s cubic-bezier(.45,0,.4,1) infinite;}
@keyframes grow{
  0%   {transform:scaleY(1);    filter:brightness(1)}
  58%  {transform:scaleY(1.17); filter:brightness(1.09)}
  100% {transform:scaleY(1);    filter:brightness(1)}
}

/* ---- glow del core ---- */
.core-pulse{
  position:absolute;left:52.8%;top:53.1%;width:20%;aspect-ratio:1;
  transform:translate(-50%,-50%);border-radius:50%;pointer-events:none;mix-blend-mode:screen;
  background:radial-gradient(circle, rgba(140,205,255,.55) 0%, rgba(60,140,255,.22) 40%, transparent 70%);
  animation:breathe 9s ease-in-out infinite;
}
@keyframes breathe{
  0%,100%{opacity:.3;transform:translate(-50%,-50%) scale(.86)}
  58%    {opacity:1; transform:translate(-50%,-50%) scale(1.22)}
}

/* ---- red: pulsos, verificaciones, destellos ---- */
.net{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;mix-blend-mode:screen;}
.flow{stroke-dasharray:7 260;stroke-linecap:round;animation:flow 4.4s linear infinite;}
@keyframes flow{from{stroke-dashoffset:267}to{stroke-dashoffset:0}}
.f1{animation-delay:0s}.f2{animation-delay:.55s}.f3{animation-delay:1.1s}.f4{animation-delay:1.65s}
.f5{animation-delay:2.2s}.f6{animation-delay:2.75s}.f7{animation-delay:3.3s}.f8{animation-delay:3.85s}

.verify{opacity:0;transform-origin:center;animation:verify 18s ease-out infinite;}
@keyframes verify{
  0%,52%{opacity:0;transform:scale(.55)}
  56%   {opacity:1;transform:scale(1.35)}
  60%,72%{opacity:.5;transform:scale(1)}
  80%,100%{opacity:0;transform:scale(1)}
}
.v1{animation-delay:0s}.v2{animation-delay:.3s}.v3{animation-delay:.6s}.v4{animation-delay:.9s}
.v-core{animation-delay:1.35s}

.twinkle{transform-origin:center;animation:twinkle 3.6s ease-in-out infinite;}
@keyframes twinkle{0%,100%{opacity:.2;transform:scale(.85)}50%{opacity:.95;transform:scale(1.15)}}
.t1{animation-delay:0s}.t2{animation-delay:1.2s}.t3{animation-delay:2.4s}
.t4{animation-delay:.6s}.t5{animation-delay:1.8s}.t6{animation-delay:3s}

/* ---- barrido + vignette ---- */
.sweep{position:absolute;top:-25%;bottom:-25%;width:22%;pointer-events:none;
  mix-blend-mode:screen;filter:blur(11px);transform:skewX(-14deg);
  background:linear-gradient(100deg,transparent,rgba(150,205,255,.08) 45%,rgba(180,220,255,.18) 50%,rgba(150,205,255,.08) 55%,transparent);
  animation:sweep 13s cubic-bezier(.75,0,.25,1) infinite;}
@keyframes sweep{0%,64%{left:-25%}100%{left:110%}}
.vig{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(72% 62% at 52.8% 53.1%, transparent 38%, rgba(1,4,16,.6) 100%);
  animation:vig 9s ease-in-out infinite;}
@keyframes vig{0%,100%{opacity:.78}50%{opacity:.44}}

.caption{position:absolute;left:3.2%;bottom:5.5%;z-index:6;margin:0;
  font-family:Raleway,system-ui,sans-serif;font-weight:300;
  font-size:clamp(9px,.86vw,13px);letter-spacing:.34em;text-transform:uppercase;
  color:rgba(200,222,255,.55);}

@media (prefers-reduced-motion:reduce){
  .stack,.agent,.tower,.core-pulse,.sweep,.vig,.flow,.verify,.twinkle{animation:none !important}
  .sweep{display:none}
  .core-pulse{opacity:.5}
  .verify{opacity:.5;transform:scale(1)}
  .twinkle{opacity:.7;transform:scale(1)}
}
</style>
</head>
