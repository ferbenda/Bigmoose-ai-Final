<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Repurpose</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600&family=Raleway:wght@200;300&display=swap" rel="stylesheet">
<style>
:root{ --hot:#b6e0ff; --acc:#5aa8ff; --radius:20px; }
body{margin:0;background:#01050f;display:grid;place-items:center;min-height:100vh;padding:28px;box-sizing:border-box;}

.repurpose{
  position:relative;width:100%;max-width:1400px;aspect-ratio:1672/941;
  border-radius:var(--radius);overflow:hidden;isolation:isolate;background:#01050f;
}
.stack{position:absolute;inset:0;transform-origin:50% 50%;
  animation:kenburns 34s ease-in-out infinite alternate;will-change:transform;}
@keyframes kenburns{from{transform:scale(1)}to{transform:scale(1.035) translate3d(-.3%,-.2%,0)}}
.stack img{position:absolute;display:block;}
.plate{inset:0;width:100%;height:100%;object-fit:cover;}

/* ---------- los 4 formatos de salida se materializan en secuencia ---------- */
.out{transform-origin:50% 50%;will-change:transform,opacity;
     animation:materialize 18s cubic-bezier(.22,1,.36,1) infinite;}
@keyframes materialize{
  0%      {opacity:.16;transform:scale(.958) translateY(1.1%)}
  5%      {opacity:1;  transform:scale(1.018) translateY(0)}
  9%,78%  {opacity:1;  transform:scale(1) translateY(0)}
  90%,100%{opacity:.16;transform:scale(.958) translateY(1.1%)}
}
.o-phone {animation-delay:0s}
.o-square{animation-delay:4.5s}
.o-player{animation-delay:9s}
.o-banner{animation-delay:13.5s}

/* ---------- overlay vectorial ---------- */
.fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;mix-blend-mode:screen;}

/* el centro late en cada cambio de formato (sin marco, solo luz) */
.beat{transform-box:fill-box;transform-origin:center;
      animation:beat 4.5s cubic-bezier(.2,.7,.3,1) infinite;}
@keyframes beat{
  0%   {opacity:.55;transform:scale(.94)}
  55%  {opacity:.10;transform:scale(1.06)}
  100% {opacity:.10;transform:scale(1.06)}
}

/* barras de progreso reproduciéndose de verdad */
.track{stroke:#cfe8ff;stroke-width:4.5;stroke-linecap:round;}
.pb-player{stroke-dasharray:232;animation:play-a 7s linear infinite;}
.pb-phone {stroke-dasharray:121;animation:play-b 5.5s linear infinite;}
@keyframes play-a{from{stroke-dashoffset:232}to{stroke-dashoffset:0}}
@keyframes play-b{from{stroke-dashoffset:121}to{stroke-dashoffset:0}}
.knob{fill:#ffffff;}
.k-player{animation:knob-a 7s linear infinite;}
.k-phone {animation:knob-b 5.5s linear infinite;}
@keyframes knob-a{from{cx:560px;cy:797px}to{cx:790px;cy:825px}}
@keyframes knob-b{from{cx:1179px;cy:376px}to{cx:1300px;cy:374px}}

/* ondas en los botones de play */
.ring{fill:none;stroke:#bfe4ff;stroke-width:2;transform-box:fill-box;transform-origin:center;
      animation:ring 3.4s cubic-bezier(.2,.6,.3,1) infinite;}
@keyframes ring{0%{opacity:.55;transform:scale(1)}70%,100%{opacity:0;transform:scale(1.9)}}
.r2{animation-delay:.7s}.r3{animation-delay:1.4s}.r4{animation-delay:2.1s}.r5{animation-delay:2.8s}

/* partículas por el flujo */
.flow{fill:none;stroke:var(--hot);stroke-width:3.4;stroke-linecap:round;
      stroke-dasharray:6 210;animation:flow 3.8s linear infinite;}
@keyframes flow{from{stroke-dashoffset:216}to{stroke-dashoffset:0}}
.d1{animation-delay:0s}.d2{animation-delay:.5s}.d3{animation-delay:1s}
.d4{animation-delay:1.5s}.d5{animation-delay:2s}.d6{animation-delay:2.5s}

/* el nodo AI pulsa al cambiar de formato */
.spark{transform-box:fill-box;transform-origin:center;animation:spark 4.5s ease-in-out infinite;}
@keyframes spark{0%,100%{opacity:.25;transform:scale(.8)}12%{opacity:1;transform:scale(1.25)}45%{opacity:.5;transform:scale(1)}}

/* ---------- barrido + vignette ---------- */
.sweep{position:absolute;top:-25%;bottom:-25%;width:20%;pointer-events:none;
  mix-blend-mode:screen;filter:blur(12px);transform:skewX(-14deg);
  background:linear-gradient(100deg,transparent,rgba(150,205,255,.07) 45%,rgba(180,220,255,.16) 50%,rgba(150,205,255,.07) 55%,transparent);
  animation:sweep 15s cubic-bezier(.75,0,.25,1) infinite;}
@keyframes sweep{0%,66%{left:-22%}100%{left:110%}}
.vig{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(76% 66% at 48% 46%, transparent 40%, rgba(0,2,10,.62) 100%);
  animation:vig 10s ease-in-out infinite;}
@keyframes vig{0%,100%{opacity:.8}50%{opacity:.5}}

.caption{position:absolute;left:3.2%;bottom:5.5%;z-index:6;margin:0;
  font-family:Raleway,system-ui,sans-serif;font-weight:300;
  font-size:clamp(9px,.86vw,13px);letter-spacing:.34em;text-transform:uppercase;
  color:rgba(200,222,255,.5);}

@media (prefers-reduced-motion:reduce){
  .stack,.out,.beat,.pb-player,.pb-phone,.k-player,.k-phone,
  .ring,.flow,.spark,.sweep,.vig{animation:none !important}
  .sweep,.ring{display:none}
  .out{opacity:1;transform:none}
  .beat{opacity:.18}
}
</style>
</head>
