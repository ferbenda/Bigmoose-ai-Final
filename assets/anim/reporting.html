<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LiveDashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600&family=Raleway:wght@200;300&display=swap" rel="stylesheet">
<style>
:root{ --hot:#8fd6ff; --radius:20px; }
body{margin:0;background:#01050f;display:grid;place-items:center;min-height:100vh;padding:28px;box-sizing:border-box;}

.dash{position:relative;width:100%;max-width:1400px;aspect-ratio:1672/941;
  border-radius:var(--radius);overflow:hidden;isolation:isolate;background:#01050f;}
.stack{position:absolute;inset:0;transform-origin:50% 50%;
  animation:kb 44s ease-in-out infinite alternate;will-change:transform;}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.018)}}
.plate{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;}

/* ---- cifras vivas: 100% CSS, los valores viven en el HTML ----
   sin animaciones, igual se ve el primer valor de cada métrica */
.figures{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;}
.fig{font-family:Archivo,system-ui,sans-serif;
     filter:drop-shadow(0 0 6px rgba(120,190,255,.45));}
.fig text{opacity:0;animation-name:cyc;animation-timing-function:steps(1);
          animation-iteration-count:infinite;}
.fig text:first-child{opacity:1}
@keyframes cyc{
  0%{opacity:0} 1.5%,24.5%{opacity:1} 25%,100%{opacity:0}
}
.k1v text{animation-duration:10.4s}
.k1v text:nth-child(2){animation-delay:2.6s}
.k1v text:nth-child(3){animation-delay:5.2s}
.k1v text:nth-child(4){animation-delay:7.8s}
.k1p text{animation-duration:13.2s}
.k1p text:nth-child(2){animation-delay:3.3s}
.k1p text:nth-child(3){animation-delay:6.6s}
.k1p text:nth-child(4){animation-delay:9.9s}
.k2v text{animation-duration:11.6s}
.k2v text:nth-child(2){animation-delay:2.9s}
.k2v text:nth-child(3){animation-delay:5.8s}
.k2v text:nth-child(4){animation-delay:8.7s}
.k2p text{animation-duration:14.8s}
.k2p text:nth-child(2){animation-delay:3.7s}
.k2p text:nth-child(3){animation-delay:7.4s}
.k2p text:nth-child(4){animation-delay:11.1s}
.k3v text{animation-duration:9.6s}
.k3v text:nth-child(2){animation-delay:2.4s}
.k3v text:nth-child(3){animation-delay:4.8s}
.k3v text:nth-child(4){animation-delay:7.2s}
.k3p text{animation-duration:16.4s}
.k3p text:nth-child(2){animation-delay:4.1s}
.k3p text:nth-child(3){animation-delay:8.2s}
.k3p text:nth-child(4){animation-delay:12.3s}
.k4v text{animation-duration:12.4s}
.k4v text:nth-child(2){animation-delay:3.1s}
.k4v text:nth-child(3){animation-delay:6.2s}
.k4v text:nth-child(4){animation-delay:9.3s}
.k4p text{animation-duration:14.0s}
.k4p text:nth-child(2){animation-delay:3.5s}
.k4p text:nth-child(3){animation-delay:7.0s}
.k4p text:nth-child(4){animation-delay:10.5s}
.top text{animation-duration:18.4s}
.top text:nth-child(2){animation-delay:4.6s}
.top text:nth-child(3){animation-delay:9.2s}
.top text:nth-child(4){animation-delay:13.8s}
.d72 text{animation-duration:20.8s}
.d72 text:nth-child(2){animation-delay:5.2s}
.d72 text:nth-child(3){animation-delay:10.4s}
.d72 text:nth-child(4){animation-delay:15.6s}

.fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;mix-blend-mode:screen;}

/* pulsos por la cinta inferior */
.belt{fill:none;stroke:#bfe6ff;stroke-width:4;stroke-linecap:round;
      stroke-dasharray:8 300;animation:belt 4.2s linear infinite;}
@keyframes belt{from{stroke-dashoffset:308}to{stroke-dashoffset:0}}
.b2{animation-delay:1.05s}.b3{animation-delay:2.1s}.b4{animation-delay:3.15s}

/* nodo radial inferior derecho */
.pingr{fill:none;stroke:#9fd8ff;stroke-width:2;transform-box:fill-box;transform-origin:center;
       animation:ping 3.2s cubic-bezier(.2,.6,.3,1) infinite;}
@keyframes ping{0%{opacity:.6;transform:scale(1)}75%,100%{opacity:0;transform:scale(2.6)}}
.p2{animation-delay:1.06s}.p3{animation-delay:2.12s}

/* marcador del gráfico principal */
.marker{fill:none;stroke:#dff2ff;stroke-width:2.4;transform-box:fill-box;transform-origin:center;
        animation:ping 2.6s cubic-bezier(.2,.6,.3,1) infinite;}

/* barridos de lectura */
.scan{fill:#cfeaff;opacity:0;animation-timing-function:linear;animation-iteration-count:infinite;}
.sc1{animation-name:sc1;animation-duration:6.5s}
.sc2{animation-name:sc2;animation-duration:4.4s;animation-delay:.8s}
.sc3{animation-name:sc3;animation-duration:5.2s;animation-delay:1.6s}
.sc4{animation-name:sc4;animation-duration:7s;animation-delay:.4s}
@keyframes sc1{0%{transform:translateX(0);opacity:0}6%,92%{opacity:.34}100%{transform:translateX(730px);opacity:0}}
@keyframes sc2{0%{transform:translateX(0);opacity:0}6%,92%{opacity:.3}100%{transform:translateX(205px);opacity:0}}
@keyframes sc3{0%{transform:translateX(0);opacity:0}6%,92%{opacity:.28}100%{transform:translateX(200px);opacity:0}}
@keyframes sc4{0%{transform:translateY(0);opacity:0}6%,92%{opacity:.22}100%{transform:translateY(400px);opacity:0}}

/* destellos vivos */
.blip{transform-box:fill-box;transform-origin:center;animation:blip 2.4s ease-out infinite;}
@keyframes blip{0%{opacity:.8;transform:scale(1)}70%,100%{opacity:0;transform:scale(3.6)}}
.bl2{animation-delay:1.2s}
.twk{transform-box:fill-box;transform-origin:center;animation:twk 3.4s ease-in-out infinite;}
@keyframes twk{0%,100%{opacity:.15;transform:scale(.7)}50%{opacity:.95;transform:scale(1.2)}}
.w2{animation-delay:.5s}.w3{animation-delay:1s}.w4{animation-delay:1.5s}
.w5{animation-delay:2s}.w6{animation-delay:2.5s}.w7{animation-delay:3s}

.vig{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(84% 76% at 50% 48%, transparent 46%, rgba(0,2,10,.5) 100%);}
.caption{position:absolute;left:2.6%;bottom:2.6%;z-index:6;margin:0;
  font-family:Raleway,system-ui,sans-serif;font-weight:300;
  font-size:clamp(9px,.78vw,12px);letter-spacing:.34em;text-transform:uppercase;
  color:rgba(190,215,255,.4);}

@media (prefers-reduced-motion:reduce){
  .stack,.belt,.pingr,.marker,.scan,.blip,.twk,.fig text{animation:none !important}
  .fig text{opacity:0}
  .fig text:first-child{opacity:1}
  .belt,.pingr,.marker,.scan,.blip{display:none}
}
</style>
</head>
