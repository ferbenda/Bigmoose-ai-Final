<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Personalization</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@200;300&display=swap" rel="stylesheet">
<style>
:root{ --r1:#5ab4ff; --r2:#df82ff; --r3:#3fe6c4; --radius:20px; }
body{margin:0;background:#01050f;display:grid;place-items:center;min-height:100vh;padding:28px;box-sizing:border-box;}

.perso{
  position:relative;width:100%;max-width:1400px;aspect-ratio:1672/941;
  border-radius:var(--radius);overflow:hidden;isolation:isolate;background:#01050f;
}
.stack{position:absolute;inset:0;transform-origin:50% 50%;
  animation:kenburns 34s ease-in-out infinite alternate;will-change:transform;}
@keyframes kenburns{from{transform:scale(1)}to{transform:scale(1.03) translate3d(-.25%,0,0)}}
.plate{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;}
.fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;mix-blend-mode:screen;}

/* ============ el flujo: pulsos por cada conexión ============ */
.flow{fill:none;stroke-width:3.6;stroke-linecap:round;stroke-dasharray:6 190;
      animation:flow 3.6s linear infinite;}
@keyframes flow{from{stroke-dashoffset:196}to{stroke-dashoffset:0}}
.q1{animation-delay:0s}.q2{animation-delay:.45s}.q3{animation-delay:.9s}
.q4{animation-delay:1.35s}.q5{animation-delay:1.8s}.q6{animation-delay:2.25s}
.q7{animation-delay:2.7s}.q8{animation-delay:3.15s}

/* ============ el cliente elige entre productos ============ */
/* cada fila corre en su propio período: nunca caen en sincronía */
.pick{fill:none;stroke-width:3;animation-timing-function:cubic-bezier(.5,0,.4,1);
      animation-iteration-count:infinite;}
.row1 .pick{stroke:var(--r1);animation-duration:9s}
.row2 .pick{stroke:var(--r2);animation-duration:10.5s}
.row3 .pick{stroke:var(--r3);animation-duration:8s}

.p-a{animation-name:pickA}.p-b{animation-name:pickB}.p-c{animation-name:pickC}
@keyframes pickA{0%,28%{opacity:1} 34%,94%{opacity:0} 100%{opacity:1}}
@keyframes pickB{0%,28%{opacity:0} 34%,61%{opacity:1} 67%,100%{opacity:0}}
@keyframes pickC{0%,61%{opacity:0} 67%,94%{opacity:1} 100%{opacity:0}}
/* la fila de viajes sólo tiene dos opciones */
.p-a2{animation-name:pickA2}.p-b2{animation-name:pickB2}
@keyframes pickA2{0%,44%{opacity:1} 50%,94%{opacity:0} 100%{opacity:1}}
@keyframes pickB2{0%,44%{opacity:0} 50%,94%{opacity:1} 100%{opacity:0}}

/* al elegir: destella el botón de compra y late el ícono de bolsa */
.flash{opacity:0;animation-timing-function:cubic-bezier(.2,.8,.3,1);
       animation-iteration-count:infinite;animation-name:flash;}
@keyframes flash{0%{opacity:0}7%{opacity:.85}34%,100%{opacity:0}}
.f1{animation-duration:3s}.f2{animation-duration:3.5s}.f3{animation-duration:4s}

.tap{transform-box:fill-box;transform-origin:center;opacity:0;
     animation-timing-function:cubic-bezier(.2,.8,.3,1);animation-iteration-count:infinite;
     animation-name:tap;}
@keyframes tap{0%{opacity:0;transform:scale(.5)}10%{opacity:.9;transform:scale(1.15)}45%,100%{opacity:0;transform:scale(1)}}
.t1{animation-duration:3s;animation-delay:.35s}
.t2{animation-duration:3.5s;animation-delay:.35s}
.t3{animation-duration:4s;animation-delay:.35s}
/* el corazón late en su propio ritmo, más lento */
.love{transform-box:fill-box;transform-origin:center;opacity:0;
      animation:tap 5.5s cubic-bezier(.2,.8,.3,1) infinite;}
.l2{animation-duration:6.5s;animation-delay:1.4s}
.l3{animation-duration:7.5s;animation-delay:2.8s}

/* ============ el hub central ============ */
.hub-ring{transform-origin:498px 497px;animation:spin 30s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.hub-glow{transform-box:fill-box;transform-origin:center;animation:hub 4.4s ease-in-out infinite;}
@keyframes hub{0%,100%{opacity:.28;transform:scale(.88)}50%{opacity:.9;transform:scale(1.14)}}

.sweep{position:absolute;top:-25%;bottom:-25%;width:18%;pointer-events:none;
  mix-blend-mode:screen;filter:blur(13px);transform:skewX(-14deg);
  background:linear-gradient(100deg,transparent,rgba(150,205,255,.06) 45%,rgba(180,220,255,.14) 50%,rgba(150,205,255,.06) 55%,transparent);
  animation:sweep 16s cubic-bezier(.75,0,.25,1) infinite;}
@keyframes sweep{0%,68%{left:-20%}100%{left:110%}}
.vig{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(80% 72% at 52% 50%, transparent 42%, rgba(0,2,10,.55) 100%);}

.caption{position:absolute;left:3.2%;bottom:4%;z-index:6;margin:0;
  font-family:Raleway,system-ui,sans-serif;font-weight:300;
  font-size:clamp(9px,.8vw,12px);letter-spacing:.34em;text-transform:uppercase;
  color:rgba(190,215,255,.45);}

@media (prefers-reduced-motion:reduce){
  .stack,.flow,.pick,.flash,.tap,.love,.hub-ring,.hub-glow,.sweep{animation:none !important}
  .sweep,.flow,.flash,.tap,.love{display:none}
  .p-a,.p-a2{opacity:1}.p-b,.p-c,.p-b2{opacity:0}
  .hub-glow{opacity:.5}
}
</style>
</head>
