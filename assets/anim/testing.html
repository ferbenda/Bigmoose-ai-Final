<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ABTesting</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@200;300&display=swap" rel="stylesheet">
<style>
:root{ --hot:#8fd6ff; --cy:#3fb4ff; --radius:20px; }
body{margin:0;background:#01050f;display:grid;place-items:center;min-height:100vh;padding:28px;box-sizing:border-box;}

.abtest{
  position:relative;width:100%;max-width:1400px;aspect-ratio:1672/941;
  border-radius:var(--radius);overflow:hidden;isolation:isolate;background:#01050f;
  container-type:inline-size;
}
.stack{position:absolute;inset:0;transform-origin:50% 50%;
  animation:kenburns 40s ease-in-out infinite alternate;will-change:transform;}
@keyframes kenburns{from{transform:scale(1)}to{transform:scale(1.022)}}
.plate{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;}

/* ============ el foco recorre A -> B -> C (ciclo 15s) ============ */
/* las variantes no seleccionadas se atenúan sobre el propio render */
.veil{position:absolute;border-radius:1.35cqw;pointer-events:none;
      backdrop-filter:brightness(.48) saturate(.55);
      -webkit-backdrop-filter:brightness(.48) saturate(.55);
      animation-duration:15s;animation-timing-function:cubic-bezier(.5,0,.5,1);
      animation-iteration-count:infinite;}
.vA{left:26.256%;top:24.442%;width:19.258%;height:51.754%;animation-name:veilA}
.vB{left:47.189%;top:21.041%;width:24.342%;height:58.874%;border-radius:2cqw;animation-name:veilB}
.vC{left:73.445%;top:24.230%;width:20.215%;height:52.285%;animation-name:veilC}
@keyframes veilA{0%,29%{opacity:0}   35%,94%{opacity:1}  100%{opacity:0}}
@keyframes veilB{0%,27%{opacity:1}   33%,62%{opacity:0}  68%,100%{opacity:1}}
@keyframes veilC{0%,60%{opacity:1}   66%,95%{opacity:0}  100%{opacity:1}}

.fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;mix-blend-mode:screen;}

/* anillo de selección */
.sel{animation-duration:15s;animation-timing-function:cubic-bezier(.5,0,.5,1);
     animation-iteration-count:infinite;}
.sA{animation-name:selA}.sB{animation-name:selB}.sC{animation-name:selC}
@keyframes selA{0%,29%{opacity:1}   35%,94%{opacity:0}  100%{opacity:1}}
@keyframes selB{0%,27%{opacity:0}   33%,62%{opacity:1}  68%,100%{opacity:0}}
@keyframes selC{0%,60%{opacity:0}   66%,95%{opacity:1}  100%{opacity:0}}

/* selector inferior A / B / C */
.knob{fill:#fff;animation:knob 15s cubic-bezier(.55,0,.2,1) infinite;}
@keyframes knob{
  0%,29%  {cx:779px;cy:810px}
  35%,62% {cx:932px;cy:817px}
  68%,95% {cx:1075px;cy:824px}
  100%    {cx:779px;cy:810px}
}
.fill{stroke:#5cc0ff;stroke-width:5;stroke-linecap:round;stroke-dasharray:297;
      animation:fill 15s cubic-bezier(.55,0,.2,1) infinite;}
@keyframes fill{
  0%,29%  {stroke-dashoffset:297}
  35%,62% {stroke-dashoffset:144}
  68%,95% {stroke-dashoffset:0}
  100%    {stroke-dashoffset:297}
}

/* donut de confianza dibujándose */
.donut{fill:none;stroke:#4db4ff;stroke-width:11;stroke-linecap:round;
       stroke-dasharray:144.5;animation:donut 6s cubic-bezier(.3,0,.2,1) infinite;}
@keyframes donut{0%{stroke-dashoffset:144.5}55%,88%{stroke-dashoffset:11.6}100%{stroke-dashoffset:144.5}}

/* barrido de lectura sobre cada gráfico y sobre las barras en vivo */
.scan{fill:#bfe6ff;animation-duration:4.6s;animation-timing-function:linear;
      animation-iteration-count:infinite;opacity:0;}
.scA{animation-name:scA}.scB{animation-name:scB;animation-delay:.6s}
.scC{animation-name:scC;animation-delay:1.2s}.scBar{animation-name:scBar;animation-duration:3.4s}
@keyframes scA{0%{transform:translateX(0);opacity:0}8%,88%{opacity:.5}100%{transform:translateX(253px);opacity:0}}
@keyframes scB{0%{transform:translateX(0);opacity:0}8%,88%{opacity:.6}100%{transform:translateX(302px);opacity:0}}
@keyframes scC{0%{transform:translateX(0);opacity:0}8%,88%{opacity:.5}100%{transform:translateX(258px);opacity:0}}
@keyframes scBar{0%{transform:translateX(0);opacity:0}10%,85%{opacity:.45}100%{transform:translateX(260px);opacity:0}}

/* indicadores vivos */
.blip{transform-box:fill-box;transform-origin:center;animation:blip 2.2s ease-out infinite;}
@keyframes blip{0%{opacity:.75;transform:scale(1)}70%,100%{opacity:0;transform:scale(3.4)}}
.b2{animation-delay:1.1s}

.sweep{position:absolute;top:-25%;bottom:-25%;width:18%;pointer-events:none;
  mix-blend-mode:screen;filter:blur(13px);transform:skewX(-14deg);
  background:linear-gradient(100deg,transparent,rgba(150,205,255,.05) 45%,rgba(180,220,255,.12) 50%,rgba(150,205,255,.05) 55%,transparent);
  animation:sweep 17s cubic-bezier(.75,0,.25,1) infinite;}
@keyframes sweep{0%,70%{left:-20%}100%{left:110%}}
.vig{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(80% 70% at 50% 48%, transparent 45%, rgba(0,2,10,.5) 100%);}

.caption{position:absolute;left:3.2%;bottom:3.2%;z-index:6;margin:0;
  font-family:Raleway,system-ui,sans-serif;font-weight:300;
  font-size:clamp(9px,.8vw,12px);letter-spacing:.34em;text-transform:uppercase;
  color:rgba(190,215,255,.42);}

@media (prefers-reduced-motion:reduce){
  .stack,.veil,.sel,.knob,.fill,.donut,.scan,.blip,.sweep{animation:none !important}
  .sweep,.scan,.blip{display:none}
  .vA,.vC{opacity:1}.vB{opacity:0}
  .sA,.sC{opacity:0}.sB{opacity:1}
  .knob{cx:932px;cy:817px}.fill{stroke-dashoffset:144}.donut{stroke-dashoffset:11.6}
}
</style>
</head>
